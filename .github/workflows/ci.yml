name: CI

# Stage 1 CI: verify every push/PR builds and tests cleanly. No deployment,
# no cloud infrastructure — see docker-compose.yml for local environments.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers (PostgreSQL) needs Docker; ubuntu-latest runners ship
      # Docker Engine pre-installed and running, so no extra setup is needed
      # — this is the same strategy AbstractIntegrationTest already uses
      # locally, just preserved here rather than replaced with H2 or a
      # GitHub Actions "services:" Postgres container.
      - name: Build and test (unit + integration + Spring context + Flyway)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` (type-check) before `vite build`,
      # so it doubles as the project's type-checking step.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload test/build output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-output
          path: |
            frontend/dist/
          retention-days: 7

  docker:
    name: Docker (config + build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # CI-only, non-production values — same pattern documented in
      # .env.example. Nothing here is a real secret.
      - name: Create CI env file
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' naydiko-backend 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Smoke test health endpoint
        run: curl --fail --silent http://localhost:8080/actuator/health

      - name: Show logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down (always)
        if: always()
        run: docker compose down -v


