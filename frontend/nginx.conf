server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so client-side routes (e.g. /login, /projects,
    # /editor/...) survive a hard refresh instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively; index.html must not be, so
    # a new deployment is picked up immediately on next refresh.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

