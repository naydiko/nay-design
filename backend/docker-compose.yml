services:
  postgres:
    image: postgres:16
    container_name: udesign-postgres

    environment:
      POSTGRES_DB: udesign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: