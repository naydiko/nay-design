

spring.datasource.url=jdbc:postgresql://localhost:5433/naydesign?options=-c%20TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port = 8090

# Supply the signing secret through the backend environment, including local runs.
app.jwt.secret=${JWT_SECRET}

# Local/dev only: adds the fictional demo vendor+catalog seed data
# (db/dev-seed) alongside the real domain migrations (db/migration).
# Never enabled outside the "local" profile, so production never sees it.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed

