# Profile used when the backend runs inside Docker Compose (see
# /docker-compose.yml). Talks to PostgreSQL via the Compose service name
# "postgres" instead of "localhost" — inside a container, "localhost"
# refers to the container itself, never a sibling container.
#
# All values are environment-driven (see /.env.example); the defaults below
# only match the docker-compose.yml service defaults so the profile still
# works if a variable is left unset.

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:udesign}?options=-c%20TimeZone=UTC
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.port=8080

# Same dev-seed catalog data as the "local" profile, so the Docker
# environment has demo vendors/products to browse out of the box. Remove
# this location (or introduce a "prod" profile without it) before shipping
# a real production deployment.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed

