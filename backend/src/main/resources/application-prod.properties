# Production profile for Google Cloud Run + Cloud SQL

# Cloud Run supplies PORT automatically.
server.port=${PORT:8080}

# Cloud SQL PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database schema is managed by Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production migrations only — no demo data.
spring.flyway.locations=classpath:db/migration

# Do not expose detailed application errors.
server.error.include-message=never
server.error.include-stacktrace=never