spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/udesign?TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=local

# No default here on purpose: JWT_SECRET must be provided by the
# environment for any profile other than "local" (see
# application-local.properties for the dev-only fallback). This makes the
# app fail fast at startup rather than silently signing tokens with a
# known secret if a future non-local/prod profile forgets to set it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Base URL of the frontend app, used to build password-reset/email-verification
# links. Must be set to the real deployed frontend origin in production.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Google Sign-In: OAuth 2.0 Client ID (Web application) from Google Cloud
# Console. Required for POST /api/auth/google to work; left blank in dev
# will make that endpoint return a 500 with a clear message instead of
# silently trusting unverified identities.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# How long password-reset / email-verification tokens remain valid.
app.auth.reset-token-expiration-ms=1800000
app.auth.verification-token-expiration-ms=86400000

# Geometry Engine: clearance depth (mm) projected outward from each door
# opening when checking whether furniture blocks it. Configurable rather
# than hard-coded so it can be tuned without code changes.
app.geometry.door-clearance-mm=700

# Comma-separated list of origins allowed to call the API with credentials
# (see SecurityConfig). Defaults cover the Vite dev server and the
# Docker-Compose frontend container's published port; override with
# CORS_ALLOWED_ORIGINS for any other setup (never use a wildcard here
# together with allowCredentials=true).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}


